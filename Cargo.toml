[package]
name = "wintasks"
version = "0.0.1"
edition = "2024"
description = "Declarative Windows scheduled task synchronization tool"
license = "MIT"
repository = "https://github.com/CatBraaain/wintasks"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"

[dev-dependencies]
tempfile = "3.27.0"
